<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時代少年團一番賞</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: -apple-system, "Helvetica Neue", sans-serif; 
            background: linear-gradient(135deg, #e6f2ff 0%, #cce3ff 100%); 
            color: #333; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { max-width: 450px; margin: auto; }
        
        .pool-card { 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 15px; 
            border-radius: 16px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .total-rem { font-size: 32px; font-weight: bold; color: #ff4757; }
        
        /* 本期賞品圖鑑長條容器 */
        .showcase-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 15px 5px;
            margin: 20px 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;  
            scrollbar-width: none; 
        }
        .showcase-container::-webkit-scrollbar {
            display: none;
        }

        /* 展示用的單張卡片外盒 */
        .showcase-item {
            flex: 0 0 110px; 
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            transition: transform 0.1s linear; /* 縮短過渡時間讓變形更即時 */
        }
        .showcase-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .showcase-item .card-label {
            font-size: 11px;
            margin-top: 6px;
            color: #444;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 抽獎結果彈出區域 (單抽用) */
        .result-single-box {
            display: none;
            width: 200px;
            margin: 15px auto;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #ff4757;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.2);
        }
        .result-single-box img {
            width: 100%;
            border-radius: 12px;
        }

        /* 十連抽個別卡片玻璃底座 */
        .mini-card-box {
            width: 18%;
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .input-group { margin-bottom: 15px; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(5px);
            color: #333; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-bottom: 10px; 
        }
        input::placeholder { color: #777; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; background: #ff4757; color: white; border: none; padding: 16px 10px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #cc3a47; transition: 0.1s; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cc3a47; }
        .btn:disabled { background: rgba(0,0,0,0.1); color: #999; box-shadow: none; cursor: not-allowed; transform: none !important; border: 1px solid rgba(0,0,0,0.05); }
        #draw-btn-10 { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); box-shadow: 0 4px 0 #cc3a47; }
        
        #multi-result-container { 
            display: none; 
            flex-wrap: wrap; 
            gap: 8px; 
            justify-content: center; 
            margin: 20px auto; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px; 
            border-radius: 16px; 
            box-sizing: border-box; 
        }

        .history-section { 
            margin-top: 30px; 
            text-align: left; 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 15px; 
            border-radius: 16px; 
        }
        .history-item { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 13px; color: #ff5e6c; font-weight: 500; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 1000; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        
        /* 【全新調整】慢速洗牌動畫（擺幅較大、速度較緩） */
        @keyframes slowShake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-3px, -4px) rotate(-1.5deg); }
            50% { transform: translate(4px, -1px) rotate(1.5deg); }
            75% { transform: translate(-2px, 3px) rotate(-1deg); }
            100% { transform: translate(2px, 2px) rotate(0deg); }
        }
        .shaking-slow {
            animation: slowShake 0.3s infinite ease-in-out;
        }

        /* 【全新調整】極速洗牌動畫（超密集震動、瘋狂洗牌感） */
        @keyframes fastShake {
            0% { transform: translate(1px, -1px) rotate(0deg); }
            20% { transform: translate(-2px, 2px) rotate(-1deg); }
            40% { transform: translate(2px, -2px) rotate(1deg); }
            60% { transform: translate(-1px, -1px) rotate(0deg); }
            80% { transform: translate(2px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -1px) rotate(-1deg); }
        }
        .shaking-fast {
            animation: fastShake 0.08s infinite linear;
        }
    </style>
</head>

 let currentPool = [];
        let isRolling = false;

        function renderShowcaseWall() {
            const wall = document.getElementById('showcase-wall');
            wall.innerHTML = cardConfig.map(card => `
                <div class="showcase-item" id="item-card-${card.id}">
                    <img src="${card.url}" alt="${card.name}">
                    <div class="card-label">${card.name.split('-')[0]}</div>
                </div>
            `).join('');
        }
        renderShowcaseWall();

        db.ref('pool').on('value', (snap) => {
            const data = snap.val();
            if (!data || data.length === 0) {
                initPool(); 
            } else {
                currentPool = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('total-count').innerText = currentPool.length + " 抽";
                checkStatus();
            }
        });

        function initPool() {
            let p = [];
            cardConfig.forEach(c => { for(let i=0; i<c.count; i++) p.push(c.id); });
            db.ref('pool').set(p);
        }

        function checkStatus() {
            if (isRolling) return;
            const name = document.getElementById('user-name').value.trim();
            const code = document.getElementById('user-code').value.trim();
            const btn1 = document.getElementById('draw-btn');
            const btn10 = document.getElementById('draw-btn-10');
            
            const isDisabled = (currentPool.length === 0 || name === "" || code === "");
            
            if (currentPool.length === 0) {
                btn1.innerText = "已全數售罄";
                btn10.innerText = "已全數售罄";
                btn1.disabled = true;
                btn10.disabled = true;
            } else {
                btn1.innerText = "單抽";
                btn10.innerText = `十連抽`;
                btn1.disabled = isDisabled;
                btn10.disabled = isDisabled || (currentPool.length < 10);
            }
        }

        async function draw(drawCount) {
            if (isRolling) return;
            const name = document.getElementById('user-name').value.trim();
            const code = document.getElementById('user-code').value.trim();

            if (!validCodes.includes(code)) {
                alert("❌ 無效的代碼，請重新確認！");
                return;
            }

            const firstLetter = code.charAt(0).toUpperCase();
            if (drawCount === 1 && firstLetter !== 'S') {
                alert("❌ 此代碼為「十連抽專用券」，請點擊【十連抽】按鈕！");
                return;
            }
            if (drawCount === 10 && firstLetter !== 'T') {
                alert("❌ 此代碼為「單抽專用券」，請點擊【單抽】按鈕！");
                return;
            }

            isRolling = true;
            document.getElementById('draw-btn').disabled = true;
            document.getElementById('draw-btn-10').disabled = true;

            const img = document.getElementById('card-img');
            const nameDisplay = document.getElementById('card-name');
            const multiContainer = document.getElementById('multi-result-container');
            const singleResultBox = document.getElementById('single-result-box');
            const wall = document.getElementById('showcase-wall');

            nameDisplay.innerText = "";
            multiContainer.innerHTML = "";
            multiContainer.style.display = "none";
            singleResultBox.style.display = "none";

            const codeRef = db.ref('usedCodes/' + code);
            const snapshot = await codeRef.get();
            if (snapshot.exists()) {
                alert("⚠️ 此代碼已被使用過，一組代碼僅限抽獎一次！");
                isRolling = false;
                checkStatus();
                return;
            }

            // 【全新修改】控制「由慢到快」的洗牌視覺節奏
            wall.classList.add('shaking-slow'); // 1. 一開始先慢速搖晃
            
            setTimeout(() => {
                if(isRolling) {
                    wall.classList.remove('shaking-slow');
                    wall.classList.add('shaking-fast'); // 2. 0.6秒後切換為瘋狂加速洗牌！
                }
            }, 600);

            db.ref('pool').transaction((p) => {
                if (p && p.length >= drawCount) {
                    window.lastDrawResults = []; 
                    let hasHighAward = false;    
                    
                    for (let i = 0; i < drawCount; i++) {
                        if (drawCount === 10 && i === 9 && !hasHighAward) {
                            let availableDCards = p.filter(id => {
                                let card = cardConfig.find(c => c.id === id);
                                return card && card.grade === "D";
                            });
                            if (availableDCards.length > 0) {
                                const pickedId = availableDCards[Math.floor(Math.random() * availableDCards.length)];
                                window.lastDrawResults.push(pickedId);
                                const idxInPool = p.indexOf(pickedId);
                                p.splice(idxInPool, 1);
                                continue; 
                            }
                        }

                        let finalIdx;
                        let drawnId;
                        let card;
                        let maxAttempts = 500; 
                        let attempts = 0;

                        do {
                            finalIdx = Math.floor(Math.random() * p.length);
                            drawnId = p[finalIdx];
                            card = cardConfig.find(c => c.id === drawnId);
                            attempts++;
                            
                            if (p.length > 5 && card && (card.grade === "S" || card.grade === "A")) {
                                continue; 
                            }
                            break; 
                        } while (attempts < maxAttempts);

                        window.lastDrawResults.push(drawnId);
                        
                        if (card && ["S","A","B","C","D"].includes(card.grade)) {
                            hasHighAward = true;
                        }

                        p.splice(finalIdx, 1);
                    }
                    return p;
                }
                return;
            }, (err, committed) => {
                if (committed) {
                    db.ref('usedCodes/' + code).set({
                        user: name,
                        time: firebase.database.ServerValue.TIMESTAMP,
                        count: drawCount
                    });

                    // 總長維持 1.8 秒開獎，完美的「慢 0.6s ➔ 快 1.2s ➔ 瞬間定格」
                    setTimeout(() => {
                        wall.classList.remove('shaking-slow');
                        wall.classList.remove('shaking-fast'); // 停止所有晃動效果
                        
                        if (drawCount === 1) {
                            const result = cardConfig.find(c => c.id === window.lastDrawResults[0]);
                            img.src = result.url;
                            singleResultBox.style.display = "block"; 
                            nameDisplay.innerText = result.name;
                            
                            const targetElement = document.getElementById(`item-card-${result.id}`);
                            if(targetElement) {
                                wall.scrollTo({ left: targetElement.offsetLeft - wall.offsetWidth/2 + 55, behavior: 'smooth' });
                            }

                            saveLocalRecord(result.name);
                            sendToGoogleForm(name, code, result.name);
                        } else {
                            multiContainer.style.display = "flex";
                            
                            window.lastDrawResults.forEach((id, index) => {
                                const result = cardConfig.find(c => c.id === id);
                                
                                const cardDiv = document.createElement('div');
                                cardDiv.className = 'mini-card-box';
                                cardDiv.innerHTML = `
                                    <img src="${result.url}" style="width: 100%; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                                    <div style="font-size: 10px; margin-top: 5px; color:#555;">#${index+1}<br><span style="color:#ff4757; font-weight:bold;">${result.name.split('-')[0]}</span></div>
                                `;
                                multiContainer.appendChild(cardDiv);
                                
                                saveLocalRecord(`[十連抽-${index+1}] ${result.name}`);
                                sendToGoogleForm(`${name}(十連抽-${index+1})`, code, result.name);
                            });
                        }
                        
                        isRolling = false;
                        checkStatus();
                    }, 1800); 
                } else {
                    wall.classList.remove('shaking-slow');
                    wall.classList.remove('shaking-fast');
                    alert("抽獎失敗，剩餘抽數可能不足，請再試一次");
                    isRolling = false;
                    checkStatus();
                }
            });
        }

        function saveLocalRecord(cardName) {
            let history = JSON.parse(localStorage.getItem('myDrawHistory')) || [];
            if(history.length > 0 && history[0] === "尚未有紀錄") history = [];
            history.unshift({ name: cardName, time: new Date().toLocaleTimeString() });
            localStorage.setItem('myDrawHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('myDrawHistory')) || [];
            const container = document.getElementById('my-history');
            if (history.length === 0) {
                container.innerHTML = "尚未有紀錄";
                return;
            }
            container.innerHTML = history.map(h => `<div class="history-item">🕒 ${h.time ? h.time : ''} - ${h.name}</div>`).join('');
        }

        function sendToGoogleForm(name, code, card) {
            const FORM_ID = "1FAIpQLSdZO-5VoffM6QduOcJ8kvEXVyFR0mdF-qtX3zQkGxqc0h7NTA";
            const url = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse?` + 
                        `entry.66319557=${encodeURIComponent(name)}&` + 
                        `entry.14544484=${encodeURIComponent(code)}&` + 
                        `entry.2002653907=${encodeURIComponent(card)}&` + 
                        `submit=Submit`;
            new Image().src = url;
        }

        renderHistory();
    </script>
